<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dad's Ad-Free Sudoku</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Difficulty Selection Screen -->
  <div id="start-screen">
    <h1>Dad's Sudoku</h1>
    <p>Choose your difficulty to begin:</p>
    <div class="difficulty-menu">
      <button onclick="startNewGame('easy')">Easy</button>
      <button onclick="startNewGame('medium')">Medium</button>
      <button onclick="startNewGame('hard')">Hard</button>
    </div>
  </div>

  <!-- Main Game Screen -->
  <div id="game-screen" class="hidden">
    <h1 id="game-title">Dad's Sudoku</h1>

    <div class="controls">
      <button onclick="showStartScreen()">Change Difficulty</button>
      <button onclick="restartCurrentDifficulty()">New Board</button>
      <button onclick="toggleNotes()" id="btn-notes">Notes: OFF</button>
    </div>

    <div id="board"></div>

    <div class="numpad">
      <button onclick="inputNumber(1)">1</button>
      <button onclick="inputNumber(2)">2</button>
      <button onclick="inputNumber(3)">3</button>
      <button onclick="inputNumber(4)">4</button>
      <button onclick="inputNumber(5)">5</button>
      <button onclick="inputNumber(6)">6</button>
      <button onclick="inputNumber(7)">7</button>
      <button onclick="inputNumber(8)">8</button>
      <button onclick="inputNumber(9)">9</button>
      <button onclick="inputNumber(0)">Clear</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
