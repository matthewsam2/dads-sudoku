<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dad's Ad-Free Sudoku</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Dad's Sudoku</h1>

  <div class="controls">
    <button onclick="startNewGame('easy')" id="btn-easy" class="active">Easy</button>
    <button onclick="startNewGame('medium')" id="btn-medium">Medium</button>
    <button onclick="startNewGame('hard')" id="btn-hard">Hard</button>
    <button onclick="toggleNotes()" id="btn-notes">Notes: OFF</button>
  </div>

  <div id="board"></div>

  <div class="numpad">
    <button onclick="inputNumber(1)">1</button>
    <button onclick="inputNumber(2)">2</button>
    <button onclick="inputNumber(3)">3</button>
    <button onclick="inputNumber(4)">4</button>
    <button onclick="inputNumber(5)">5</button>
    <button onclick="inputNumber(6)">6</button>
    <button onclick="inputNumber(7)">7</button>
    <button onclick="inputNumber(8)">8</button>
    <button onclick="inputNumber(9)">9</button>
    <button onclick="inputNumber(0)">Clear</button>
  </div>

  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
